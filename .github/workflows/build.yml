name: Build

on:
  push:
    branches: [ scaffold, main ]
  pull_request:
    branches: [ scaffold, main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Permiso gradlew
        run: chmod +x gradlew

      - name: Compilar debug (mobile + tv)
        run: ./gradlew assembleMobileDebug assembleTvDebug --stacktrace

      - name: APK mobile
        uses: actions/upload-artifact@v4
        with:
          name: kitsune-mobile-debug
          path: app/build/outputs/apk/mobile/debug/*.apk
          if-no-files-found: error

      - name: APK tv
        uses: actions/upload-artifact@v4
        with:
          name: kitsune-tv-debug
          path: app/build/outputs/apk/tv/debug/*.apk
          if-no-files-found: error
